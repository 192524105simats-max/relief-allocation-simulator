# Render Blueprint: free web service for the Relief Allocation Simulator.
# Database connection values (DB_HOST, DB_PORT, DB_USER, DB_PASSWORD) are entered in the Render dashboard.
services:
  - type: web
    name: relief-allocation-simulator
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: NODE_VERSION
        value: "20"
      - key: DB_SSL
        value: "true"
      - key: DB_NAME
        value: relief_db
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
